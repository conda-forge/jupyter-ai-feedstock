context:
  version: "3.2.0rc0"

package:
  name: jupyter-ai
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/j/jupyter-ai/jupyter_ai-${{ version }}.tar.gz
  sha256: e2b634e4c7e2eebc7ef0b6a979a02c3404c4d0ccb6a324f2ceecc3043c1528db

build:
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  number: 1

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling >=1.4.0
    - jupyterlab >=4.0,<5
    - hatch-nodejs-version
    - pip
    - hatch-jupyter-builder
  run:
    - python >=${{ python_min }}
    - jupyter-ai-acp-client >=0.3.0rc0,<0.4.0
    - jupyter-ai-chat-commands >=0.0.4,<0.1.0
    - jupyter-ai-persona-manager >=0.2.0rc0,<0.3.0
    - jupyter-ai-router >=0.1.0rc0,<0.2.0
    - jupyter-ai-tools >=0.7.0rc0,<0.8.0
    - jupyter-live-content >=0.1.1,<0.2.0
    - jupyter-server-mcp >=0.3.0rc0,<0.4.0
    - jupyterlab-chat >=0.25.0rc0,<0.26.0
    - jupyterlab-commands-toolkit >=0.2.0rc0,<0.3.0

tests:
  - python:
      imports:
        - jupyter_ai
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  homepage: https://github.com/jupyterlab/jupyter-ai
  repository: https://github.com/jupyterlab/jupyter-ai
  documentation: https://jupyter-ai.readthedocs.io/en/v3/
  license: BSD-3-Clause
  license_file: LICENSE
  summary: "A set of extensions providing agentic AI in JupyterLab"

extra:
  recipe-maintainers:
    - dlqqq
    - 3coins
    - andrii-i
    - srdas
