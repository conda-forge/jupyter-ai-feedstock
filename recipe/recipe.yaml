context:
  version: "3.1.3"

package:
  name: jupyter-ai
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/j/jupyter-ai/jupyter_ai-${{ version }}.tar.gz
  sha256: 780d693a5fcb6bea20393704d2ad85247e4bc43679eb61fc4613ea0fe4f3b485

build:
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling >=1.4.0
    - jupyterlab >=4.0,<5
    - hatch-nodejs-version
    - pip
    - hatch-jupyter-builder
  run:
    - python >=${{ python_min }}
    - jupyter-ai-acp-client >=0.2.1,<0.3.0
    - jupyter-ai-chat-commands >=0.0.4,<0.1.0
    - jupyter-ai-persona-manager >=0.1.2,<0.2.0
    - jupyter-ai-router >=0.0.7,<0.1.0
    - jupyter-ai-tools >=0.6.1,<0.7.0
    - jupyter_server_documents >=0.3.3,<0.4.0
    - jupyter-server-mcp >=0.2.1,<0.4.0
    - jupyterlab-chat >=0.23.2,<0.24.0
    - jupyterlab-commands-toolkit >=0.1.6,<0.2.0
    - jupyterlab-notebook-awareness >=0.2.0,<0.3.0

tests:
  - python:
      imports:
        - jupyter_ai
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  homepage: https://github.com/jupyterlab/jupyter-ai
  repository: https://github.com/jupyterlab/jupyter-ai
  documentation: https://jupyter-ai.readthedocs.io/en/v3/
  license: BSD-3-Clause
  license_file: LICENSE
  summary: "A set of extensions providing agentic AI in JupyterLab"

extra:
  recipe-maintainers:
    - dlqqq
    - 3coins
    - andrii-i
    - srdas
